name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            ext: .exe
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            ext: ""
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: WorktreeManager/WorktreeManager/WorktreeManager.csproj

      - name: Publish (${{ matrix.rid }})
        shell: bash
        run: >
          dotnet publish WorktreeManager/WorktreeManager/WorktreeManager.csproj
          -c Release
          -r ${{ matrix.rid }}
          -o publish/${{ matrix.rid }}
          -p:Version=${GITHUB_REF_NAME#v}
          -p:IncludeSourceRevisionInInformationalVersion=false

      - name: Package archive (zip - Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/${{ matrix.rid }}/wm${{ matrix.ext }} -DestinationPath wm-${{ matrix.rid }}.zip

      - name: Package archive (tar.gz - Linux)
        if: matrix.archive == 'tar.gz'
        run: |
          chmod +x publish/${{ matrix.rid }}/wm${{ matrix.ext }}
          tar -czf wm-${{ matrix.rid }}.tar.gz \
            -C publish/${{ matrix.rid }} wm${{ matrix.ext }} \
            -C "$GITHUB_WORKSPACE" LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: wm-${{ matrix.rid }}.${{ matrix.archive }}
          if-no-files-found: error
          archive: false

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          skip-decompress: 'true'

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > checksums.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
          
  publish-winget:
    needs: [build, release]
    runs-on: windows-latest
    concurrency:
      group: winget-publish
      cancel-in-progress: false
    env:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: wm-win-x64.zip
          path: artifacts
          skip-decompress: 'true'

      - name: Create WinGet manifest
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $archive = Resolve-Path artifacts/wm-win-x64.zip
          $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash
          $releaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/wm-win-x64.zip"

          @"
          # yaml-language-server: `$schema=https://aka.ms/winget-manifest.singleton.1.10.0.schema.json

          PackageIdentifier: InventorViktor.WorktreeManager
          PackageVersion: $version
          PackageLocale: en-US
          Publisher: InventorViktor
          PublisherUrl: https://github.com/InventorViktor
          PublisherSupportUrl: https://github.com/$env:GITHUB_REPOSITORY/issues
          PackageName: Worktree Manager
          PackageUrl: https://github.com/$env:GITHUB_REPOSITORY
          License: MIT
          LicenseUrl: https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_REF_NAME/LICENSE
          ShortDescription: CLI tool for managing Git worktrees
          Moniker: wm
          Tags:
            - cli
            - git
            - worktree
          ReleaseNotesUrl: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME
          InstallerType: zip
          NestedInstallerType: portable
          NestedInstallerFiles:
            - RelativeFilePath: wm.exe
              PortableCommandAlias: wm
          Commands:
            - wm
          UpgradeBehavior: install
          Installers:
            - Architecture: x64
              InstallerUrl: $releaseUrl
              InstallerSha256: $checksum
          ManifestType: singleton
          ManifestVersion: 1.10.0
          "@ | Set-Content -Path winget.yaml -Encoding utf8

      - name: Submit to WinGet
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            throw "WINGET_CREATE_GITHUB_TOKEN is not configured"
          }

          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit `
            --prtitle "New version: InventorViktor.WorktreeManager $($env:GITHUB_REF_NAME.Substring(1))" `
            --no-open `
            winget.yaml
