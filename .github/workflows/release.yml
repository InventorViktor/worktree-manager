name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            ext: .exe
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            ext: ""
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: WorktreeManager/WorktreeManager/WorktreeManager.csproj

      - name: Publish (${{ matrix.rid }})
        shell: bash
        run: >
          dotnet publish WorktreeManager/WorktreeManager/WorktreeManager.csproj
          -c Release
          -r ${{ matrix.rid }}
          -o publish/${{ matrix.rid }}
          -p:Version=${GITHUB_REF_NAME#v}

      - name: Package archive (zip - Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/${{ matrix.rid }}/wm${{ matrix.ext }} -DestinationPath wm-${{ matrix.rid }}.zip

      - name: Package archive (tar.gz - Linux)
        if: matrix.archive == 'tar.gz'
        run: |
          chmod +x publish/${{ matrix.rid }}/wm${{ matrix.ext }}
          tar -czf wm-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} wm${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wm-${{ matrix.rid }}
          path: wm-${{ matrix.rid }}.${{ matrix.archive }}
          if-no-files-found: error
          archive: false

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          skip-decompress: 'true'

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > checksums.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
